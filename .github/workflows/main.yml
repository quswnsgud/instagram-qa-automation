# 1. 이 워크플로우(주문서)의 이름입니다. 깃허브 페이지에 이 이름으로 표시됩니다.
name: Instagram Automation CI

# 2. 어떤 '이벤트'가 발생했을 때 로봇을 깨울지 정합니다.
on:
  push:
    branches:
      - feature/cicd  # 우리가 새로 만든 feature/cicd 브랜치에 코드가 푸시될 때만 작동합니다.

# 3. 로봇이 순서대로 실행할 작업(Job)들입니다.
jobs:
  test-automation:
    # 깃허브가 제공하는 가상 컴퓨터의 운영체제(OS)를 우분투(리눅스) 최신 버전으로 선택합니다.
    runs-on: ubuntu-latest

    steps:
      # 단계 1: 깃허브 저장소에 있는 우리 코드를 가상 컴퓨터로 복사해 옵니다.
      - name: Checkout code
        uses: actions/checkout@v4

      # 단계 2: 가상 컴퓨터에 파이썬을 설치합니다. (버전은 3.10 기준)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 단계 3: 테스트 실행에 필요한 라이브러리들을 설치합니다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium python-dotenv Appium-Python-Client

      # 단계 4: 파이턴 코드를 실행하여 인스타그램 로그인 테스트를 돌립니다.
      - name: Run Instagram Test
        run: |
          pytest tests/